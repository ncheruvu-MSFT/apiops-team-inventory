openapi: 3.0.1
info:
  title: Team Inventory API
  description: Stock levels and warehouse lookups. Owned by Team Inventory.
  version: '1.0'
servers:
  - url: https://<APIM_SERVICE_NAME>.azure-api.net/team-inventory
paths:
  /stock:
    get:
      summary: Get stock level
      operationId: get-stock-level
      responses:
        '200':
          description: ''
  /reserve:
    post:
      summary: Reserve stock
      operationId: post-stock-reservation
      responses:
        '200':
          description: ''
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]
